<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleAgent UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10">
  <div class="max-w-2xl mx-auto px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-8">SimpleAgent UI</h1>

    <!-- ── Chat ──────────────────────────────────────────────────────────── -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">POST /chat</h2>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          System Prompt <span class="text-gray-400 font-normal">(optional)</span>
        </label>
        <textarea id="systemPrompt" rows="3"
          placeholder="You are a helpful assistant."
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          User Message <span class="text-red-500">*</span>
        </label>
        <textarea id="userMessage" rows="4"
          placeholder="Type your message here…"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
        <p id="chatError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <button id="submitBtn" onclick="submitChat()"
        class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50
               text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Submit
      </button>

      <div id="chatResponse" class="mt-5 hidden">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Response</h3>
        <div id="chatResponseText"
          class="bg-gray-50 rounded-lg p-4 text-sm text-gray-800 whitespace-pre-wrap">
        </div>
      </div>
    </section>

    <!-- ── Eval ───────────────────────────────────────────────────────────── -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-1">POST /eval</h2>
      <p class="text-sm text-gray-500 mb-4">Test a prompt against the CS agent. System prompt pre-loaded from <code class="bg-gray-100 px-1 rounded">.pm/cs_agent_prompt.md</code>.</p>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          System Prompt <span class="text-gray-400 font-normal">(editable)</span>
        </label>
        <textarea id="evalSystemPrompt" rows="6"
          placeholder="Loading CS agent prompt…"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-green-500 resize-y font-mono"></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Test Message <span class="text-red-500">*</span>
        </label>
        <textarea id="evalMessage" rows="3"
          placeholder="e.g. My Xbox won't sign in, what do I do?"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-green-500 resize-y"></textarea>
        <p id="evalError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <button id="evalBtn" onclick="submitEval()"
        class="bg-green-600 hover:bg-green-700 disabled:opacity-50
               text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Evaluate
      </button>

      <div id="evalResponse" class="mt-5 hidden">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Response</h3>
        <div id="evalResponseText"
          class="bg-gray-50 rounded-lg p-4 text-sm text-gray-800 whitespace-pre-wrap">
        </div>
      </div>
    </section>

    <!-- ── Batch Test ─────────────────────────────────────────────────────── -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Batch Customer Interaction Test</h2>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Agent System Prompt <span class="text-gray-400 font-normal">(optional)</span>
        </label>
        <textarea id="batchSystemPrompt" rows="3"
          placeholder="You are a helpful customer support agent."
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Customer Persona / Topic <span class="text-red-500">*</span>
        </label>
        <textarea id="batchPersona" rows="2"
          placeholder="e.g. frustrated customers asking about delayed orders for an e-commerce store"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
        <p id="batchError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <div class="mb-4 flex items-center gap-3">
        <label class="text-sm font-medium text-gray-700">Number of interactions</label>
        <input id="batchN" type="number" value="5" min="1" max="20"
          class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <button id="batchBtn" onclick="runBatchTest()"
        class="bg-purple-600 hover:bg-purple-700 disabled:opacity-50
               text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Generate Interactions
      </button>

      <div id="batchProgress" class="mt-4 text-sm text-gray-500 hidden"></div>

      <div id="batchResults" class="mt-5 space-y-4 hidden"></div>
    </section>

    <!-- ── Health ─────────────────────────────────────────────────────────── -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">GET /health</h2>

      <button onclick="checkHealth()"
        class="bg-gray-700 hover:bg-gray-800 text-white text-sm font-medium
               px-4 py-2 rounded-lg transition-colors">
        Check Health
      </button>

      <div id="healthResponse" class="mt-5 hidden">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Response</h3>
        <pre id="healthResponseText"
          class="bg-gray-50 rounded-lg p-4 text-sm text-gray-800 overflow-x-auto">
        </pre>
      </div>
    </section>
  </div>

  <script>
    const BASE_URL = 'http://localhost:8000';

    async function submitChat() {
      const systemPrompt = document.getElementById('systemPrompt').value.trim();
      const userMessage  = document.getElementById('userMessage').value.trim();
      const errorEl      = document.getElementById('chatError');
      const responseDiv  = document.getElementById('chatResponse');
      const responseText = document.getElementById('chatResponseText');
      const btn          = document.getElementById('submitBtn');

      errorEl.classList.add('hidden');
      responseDiv.classList.add('hidden');

      if (!userMessage) {
        errorEl.textContent = 'User Message is required.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Submitting…';

      const payload = { message: userMessage };
      if (systemPrompt) payload.system_prompt = systemPrompt;

      try {
        const res = await fetch(`${BASE_URL}/chat`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server error ${res.status}: ${text}`);
        }
        const data = await res.json();
        responseText.textContent = data.reply;
        responseDiv.classList.remove('hidden');
      } catch (err) {
        errorEl.textContent = err.message.includes('Failed to fetch')
          ? `Could not connect to server at ${BASE_URL}. Is it running?`
          : err.message;
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Submit';
      }
    }

    async function runBatchTest() {
      const systemPrompt = document.getElementById('batchSystemPrompt').value.trim();
      const persona      = document.getElementById('batchPersona').value.trim();
      const n            = parseInt(document.getElementById('batchN').value, 10) || 5;
      const errorEl      = document.getElementById('batchError');
      const progressEl   = document.getElementById('batchProgress');
      const resultsEl    = document.getElementById('batchResults');
      const btn          = document.getElementById('batchBtn');

      errorEl.classList.add('hidden');
      resultsEl.classList.add('hidden');
      resultsEl.innerHTML = '';

      if (!persona) {
        errorEl.textContent = 'Customer Persona / Topic is required.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Generating…';
      progressEl.textContent = 'Step 1/2: Generating customer messages…';
      progressEl.classList.remove('hidden');

      try {
        // Step 1: generate N customer messages via the LLM
        const genPrompt = `Generate exactly ${n} realistic, varied customer messages for the following scenario: ${persona}. Return ONLY a JSON array of strings with no markdown, no commentary, and no extra text. Example format: ["message one","message two"]`;
        const genRes = await fetch(`${BASE_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: genPrompt }),
        });
        if (!genRes.ok) throw new Error(`Generation failed: ${genRes.status}`);
        const genData = await genRes.json();

        let messages;
        try {
          messages = JSON.parse(genData.reply);
          if (!Array.isArray(messages)) throw new Error();
        } catch {
          throw new Error('Could not parse generated messages. Try again or simplify the persona.');
        }

        // Step 2: fan out agent calls in parallel
        progressEl.textContent = `Step 2/2: Running ${messages.length} interactions…`;

        const payload = (msg) => {
          const p = { message: msg };
          if (systemPrompt) p.system_prompt = systemPrompt;
          return p;
        };

        let completed = 0;
        const results = await Promise.all(messages.map(async (msg, i) => {
          const res = await fetch(`${BASE_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload(msg)),
          });
          if (!res.ok) throw new Error(`Chat call ${i + 1} failed: ${res.status}`);
          const data = await res.json();
          completed++;
          progressEl.textContent = `Step 2/2: Running interactions… (${completed}/${messages.length})`;
          return { customer: msg, agent: data.reply };
        }));

        // Render results
        resultsEl.innerHTML = results.map((r, i) => `
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            <div class="bg-gray-50 px-4 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wide">
              Interaction ${i + 1}
            </div>
            <div class="p-4 space-y-3">
              <div>
                <p class="text-xs font-semibold text-purple-600 mb-1">Customer</p>
                <p class="text-sm text-gray-800 whitespace-pre-wrap">${escapeHtml(r.customer)}</p>
              </div>
              <div>
                <p class="text-xs font-semibold text-blue-600 mb-1">Agent</p>
                <p class="text-sm text-gray-800 whitespace-pre-wrap">${escapeHtml(r.agent)}</p>
              </div>
            </div>
          </div>
        `).join('');

        resultsEl.classList.remove('hidden');
        progressEl.textContent = `Done — ${results.length} interactions generated.`;
      } catch (err) {
        errorEl.textContent = err.message.includes('Failed to fetch')
          ? `Could not connect to server at ${BASE_URL}. Is it running?`
          : err.message;
        errorEl.classList.remove('hidden');
        progressEl.classList.add('hidden');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Generate Interactions';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadEvalPrompt() {
      try {
        const res = await fetch(`${BASE_URL}/eval/prompt`);
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('evalSystemPrompt').value = data.prompt;
      } catch {
        // server not running — leave placeholder text
      }
    }

    async function submitEval() {
      const systemPrompt = document.getElementById('evalSystemPrompt').value.trim();
      const message      = document.getElementById('evalMessage').value.trim();
      const errorEl      = document.getElementById('evalError');
      const responseDiv  = document.getElementById('evalResponse');
      const responseText = document.getElementById('evalResponseText');
      const btn          = document.getElementById('evalBtn');

      errorEl.classList.add('hidden');
      responseDiv.classList.add('hidden');

      if (!message) {
        errorEl.textContent = 'Test Message is required.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Evaluating…';

      const payload = { message };
      if (systemPrompt) payload.system_prompt = systemPrompt;

      try {
        const res = await fetch(`${BASE_URL}/eval`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server error ${res.status}: ${text}`);
        }
        const data = await res.json();
        responseText.textContent = data.reply;
        responseDiv.classList.remove('hidden');
      } catch (err) {
        errorEl.textContent = err.message.includes('Failed to fetch')
          ? `Could not connect to server at ${BASE_URL}. Is it running?`
          : err.message;
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Evaluate';
      }
    }

    loadEvalPrompt();

    async function checkHealth() {
      const responseDiv  = document.getElementById('healthResponse');
      const responseText = document.getElementById('healthResponseText');
      try {
        const res  = await fetch(`${BASE_URL}/health`);
        const data = await res.json();
        responseText.textContent = JSON.stringify(data, null, 2);
        responseDiv.classList.remove('hidden');
      } catch {
        responseText.textContent =
          `Could not connect to server at ${BASE_URL}. Is it running?`;
        responseDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
